name: Bug report
description: Something is wrong in Loom
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you see, and what did you expect?
      placeholder: |
        I expected X. I got Y instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: env
    attributes:
      label: Environment
      placeholder: |
        - .NET SDK:
        - OS:
        - Loom commit:
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs / stack traces
      render: shell
